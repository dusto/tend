name: tag

# Cuts a version tag, then triggers the release workflow on it. Two entry points:
#
#   * PR label — when a PR merges carrying a `release:patch|minor|major` label,
#     the matching bump is applied.
#   * Manual — run this workflow with a chosen bump level.
#
# The tag is pushed with GITHUB_TOKEN, which (by design) does NOT trigger the
# tag-push side of release.yml, so this workflow explicitly dispatches release.yml
# on the new tag ref. (PRs from forks run with a read-only token and cannot tag;
# this repo takes same-repo PRs.)
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the tag
  actions: write # dispatch release.yml

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
        (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
         contains(github.event.pull_request.labels.*.name, 'release:minor') ||
         contains(github.event.pull_request.labels.*.name, 'release:major')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags to compute the next version

      - name: Determine bump level
        id: level
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "level=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | grep -q 'release:major'; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | grep -q 'release:minor'; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          [ -z "$latest" ] && latest="v0.0.0"
          ver="${latest#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          case "${{ steps.level.outputs.level }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump level"; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${next} (from ${latest}, ${{ steps.level.outputs.level }} bump)"

      - name: Create and push tag
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Trigger release for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ steps.ver.outputs.tag }}"
