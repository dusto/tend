# Example tendd configuration.
#
# Copy to one of (first match wins):
#   $TEND_CONFIG
#   $XDG_CONFIG_HOME/tend/config.toml
#   ~/.config/tend/config.toml
#
# With no config file, tendd uses built-in defaults (codex, claude, kiro).
# A file REPLACES the defaults — list every provider you want available.
# A malformed or invalid file makes tendd exit with an error rather than
# silently falling back.

# Each [[acp.providers]] entry describes one ACP server. Any ACP-compatible
# agent is configured by these fields alone — no per-provider code.

[[acp.providers]]
id = "claude"                  # provider id (referenced by the plugin + :TendProvider)
command = "claude-agent-acp"   # the ACP server binary; must be on the daemon's PATH
# args = []                    # extra args passed to the command
# env = ["KEY=value"]          # appended to the daemon's environment (adds, not replaces)
cwd_mode = "workspace"         # "workspace" (run in the worktree root) | "inherit"
enabled = true                 # only enabled providers are selectable

# The codex ACP adapter is the standalone codex-acp binary (the codex CLI's
# own subcommand is app-server, not acp).
[[acp.providers]]
id = "codex"
command = "codex-acp"
cwd_mode = "workspace"
enabled = false

# Task sources map a workspace to its backlog.
#
# Define each backlog once as a named source, then map repositories to it. A
# workspace resolves to the source of the first rule whose repos/under matches
# its repo root; with no match it uses its OWN in-tree source (a .beads dir in
# the repo root, when present); with neither it has no source (task.* is an
# empty queue and writes report that none is configured — beads is never forced
# on a repo).
#
# Matching is by robust path identity, not repo-name keywords:
#   repos = exact repository roots (arbitrary names, grouped by identity)
#   under = parent directories; any repository beneath one applies
# An exact `repos` match takes precedence over an `under` prefix match.
#
# `name` is the source identity; it is carried in a task's ref so several
# backlogs stay distinguishable. A source of type "beads" runs `bd` in `dir`.
#
# `labels` optionally scopes a source to a subset of its backlog: only tasks
# carrying all of them are listed, and new tasks are tagged with them. One
# planning repo can thus back several code repos that each see only their slice —
# define one source per label subset over the same `dir`.

# [[tasks.sources]]
# name = "tend"
# type = "beads"
# dir  = "/home/you/work/tend-workspace/tend-planning"
# labels = ["repo:tend"]          # optional; omit to see the whole backlog

# [[tasks.rules]]
# repos = [
#   "/home/you/work/tend-workspace/tend",
#   "/home/you/work/tend-workspace/tend.nvim",
# ]
# use = "tend"

# [[tasks.rules]]
# under = ["/home/you/work/acme"]     # every repo under here shares one backlog
# use   = "acme"

# Memory sources map a workspace to where its memories (agent notes + steering)
# are stored. It mirrors task sources: define each store once as a named source,
# then map repositories to it. A workspace resolves to the source of the first
# rule whose repos/under matches its repo root; with no match it uses its OWN
# in-tree store (<repo>/.tend/memory). This only changes WHERE memory is stored —
# the memory.* tools are unchanged.
#
# Matching is by the same robust path identity as task sources:
#   repos = exact repository roots
#   under = parent directories; any repository beneath one applies
# An exact `repos` match takes precedence over an `under` prefix match.
#
# A source of type "file" reads/writes markdown memory files under `dir`. Several
# repos can share one `dir` (a central memory repo) or map to distinct dirs.

# [[memory.sources]]
# name = "central"
# type = "file"
# dir  = "/home/you/work/tend-workspace/tend-memory"

# [[memory.rules]]
# under = ["/home/you/work/tend-workspace"]   # all these repos share one memory store
# use   = "central"

# The [summarize] section configures TEND's pluggable summarizer: how it condenses
# the context it owns (memory/steering it injects, a session transcript, a resume
# seed) to a budget. With no config the deterministic fallback (truncation) is
# used, so summarization always works.
#
#   backend      = none | local | acp   (default none)
#   target_chars = default output budget in characters (default 2000)
#
# backend "local" runs a local command as the model: the prompt is written to its
# stdin and its stdout is the summary (wrap an Ollama/llm-style CLI).
#
# backend "acp" summarizes on a DEDICATED session of a configured provider — a
# separate session from the working one, so summarization never pollutes it. The
# provider must be an enabled [[acp.providers]] id.

# [summarize]
# backend = "local"
# target_chars = 2000
# [summarize.local]
# command = "ollama"
# args    = ["run", "llama3.2"]

# [summarize]
# backend = "acp"
# [summarize.acp]
# provider = "claude"          # an enabled [[acp.providers]] id
# model    = ""                # optional: pin a model on the summarizer session

# The [compact] section configures the post-turn agent context-window compaction
# trigger. When a session's reported context fullness crosses the threshold, TEND
# shrinks BOTH contexts: it forwards the provider's own command to shrink the
# agent-side context (/compact when advertised, else /clear; Claude offers both,
# Codex neither) AND compacts the daemon transcript (via the [summarize] backend)
# into a summary record. Both run together — shrinking only the agent while TEND
# still holds the full history would re-inflate the context on the next resume.
# Compaction is non-destructive: raw records are kept, replay just serves the
# summary. It is off by default: forwarding a command spends a turn and mutates
# the provider's context, so it is opt-in. The trigger only fires for providers
# that report context usage (usage_update); providers that do not are inert.
#
#   enabled   = turn the trigger on (default false)
#   threshold = context-window fullness fraction, (0,1] (default 0.85)
#   budget    = character budget for the transcript summarizer (0 = summarizer default)

# [compact]
# enabled   = true
# threshold = 0.85
# budget    = 0
